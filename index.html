<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consultório Médico</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<aside class="menu">
  <h1>Clínica<br>Vida</h1>
  <nav>
    <button data-tab="agenda" class="ativo">Agenda</button>
    <button data-tab="pacientes">Pacientes</button>
    <button data-tab="prontuario">Prontuário</button>
  </nav>
  <p class="hoje" id="hoje"></p>
</aside>

<main>
  <!-- AGENDA -->
  <section id="agenda" class="aba ativa">
    <h2>Agenda de consultas</h2>
    <form id="formConsulta" class="linha">
      <select id="cPaciente" required></select>
      <input type="date" id="cData" required>
      <input type="time" id="cHora" required>
      <input id="cMotivo" placeholder="Motivo da consulta" required>
      <button>Agendar consulta</button>
    </form>
    <div class="filtro"><label>Dia: <input type="date" id="filtroData"></label></div>
    <table><thead><tr><th>Hora</th><th>Paciente</th><th>Motivo</th><th>Status</th><th></th></tr></thead>
    <tbody id="listaConsultas"></tbody></table>
  </section>

  <!-- PACIENTES -->
  <section id="pacientes" class="aba">
    <h2>Pacientes</h2>
    <form id="formPaciente" class="linha">
      <input id="pNome" placeholder="Nome completo" required>
      <input id="pCpf" placeholder="CPF" maxlength="14" required>
      <input type="date" id="pNasc" required>
      <input id="pTel" placeholder="Telefone" required>
      <button>Cadastrar paciente</button>
    </form>
    <input id="busca" class="busca" placeholder="Buscar por nome ou CPF">
    <table><thead><tr><th>Nome</th><th>CPF</th><th>Idade</th><th>Telefone</th><th></th></tr></thead>
    <tbody id="listaPacientes"></tbody></table>
  </section>

  <!-- PRONTUÁRIO -->
  <section id="prontuario" class="aba">
    <h2>Prontuário</h2>
    <form id="formProntuario" class="coluna">
      <select id="rPaciente" required></select>
      <textarea id="rTexto" rows="4" placeholder="Queixa, diagnóstico, prescrição..." required></textarea>
      <button>Salvar registro</button>
    </form>
    <div id="historico"></div>
  </section>
</main>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
